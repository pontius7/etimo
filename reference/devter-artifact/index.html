.ct.ctm .cs{grid-template-rows:2.1rem 1.5rem 1.35rem!important;row-gap:.3rem!important}.ct.ctm .cpr{height:1.5rem!important;line-height:1.5rem!important;overflow:visible!important;font-size:.9rem!important;white-space:nowrap}
.ct.ctm .cx{font-size:1.65rem!important}
}

/* ---- v67: wheel labels: high contrast, sturdy serif ---- */
.wla,.wlb,.wll{font-family:"Noto Serif","Noto Serif Display",Georgia,serif!important}
.wla{font-weight:700!important;letter-spacing:.07em!important;fill:#fff!important;stroke:rgba(0,0,0,.45);stroke-width:2.6px;paint-order:stroke;stroke-linejoin:round}
.wlb{font-weight:700!important;letter-spacing:.05em!important;fill:#0b0f1a!important;stroke:rgba(255,255,255,.7);stroke-width:2.6px;paint-order:stroke;stroke-linejoin:round}
.wll{font-weight:600!important;letter-spacing:.01em!important;fill:#0b0f1a!important;stroke:rgba(255,255,255,.6);stroke-width:2px;paint-order:stroke;stroke-linejoin:round}
.wtop .wla{letter-spacing:.07em!important;font-weight:700!important}

/* ---- v68: historical languages on the map ---- */
.zones path.zone.hist{fill-opacity:.18!important;stroke-dasharray:3 2.5;stroke-width:1.2px;vector-effect:non-scaling-stroke}

.view.nowords .ltiles,.view.nowords>.search{display:none}
.view.nowords .lrows .empty{font-size:1.05rem;line-height:1.5;color:var(--ink);padding:1rem 0}

/* ---- v69: all wheel labels white ---- */
.wla,.wlb,.wll{fill:#fff!important;stroke:rgba(0,0,0,.5)!important;paint-order:stroke;stroke-linejoin:round}
.wll{stroke-width:2.2px!important}

/* ---- v70: wheel typography redesign: clean white sans, no outlines ---- */
.wla,.wlb,.wll{font-family:"Manrope",var(--sans),system-ui,sans-serif!important;fill:#fff!important;stroke:none!important;paint-order:normal!important}
.wla,.wtop .wla{font-weight:600!important;letter-spacing:.14em!important}
.wlb{font-weight:600!important;letter-spacing:.1em!important;fill:rgba(255,255,255,.92)!important}
.wll{font-weight:500!important;letter-spacing:.01em!important}
/* ---- tiles: smaller words, nothing cut ---- */
.ct.ctm .cx{font-size:1.4rem!important;line-height:1.2!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.ct.ctm .cm{font-size:1.15rem!important;text-overflow:ellipsis!important}.spec-h .spec-c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.spec .sw{max-width:100%}
.ct.ctm .cs>*{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct.ctm .cpr{font-size:.85rem!important}

/* ---- v71: outside wheel labels, horizontal depth pills, map button spacing ---- */
.wlo{font-family:"Manrope",var(--sans),system-ui,sans-serif;font-weight:500;fill:var(--ink);letter-spacing:.01em;pointer-events:none}
.kdp{width:46px!important;height:28px!important}
.kdp i{width:22px!important;height:7px!important;border-radius:4px!important}
.kdp.cur i{width:36px!important;height:7px!important}
.kdp:hover i{transform:scaleX(1.12)!important}
.kdp:active i{transform:scaleX(.86)!important}
.wmap{margin-top:2rem!important}

.sb svg path.wld{fill:none;stroke:var(--mut,#8a8f98);stroke-width:.8px;opacity:.55;vector-effect:non-scaling-stroke}
